<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Maker - Working Version</title>
<style>body{background:#000;color:#fff;text-align:center;font-family:system-ui;padding:10px;margin:0}h1{font-size:20px;margin:10px}
.tabs{display:flex;gap:6px;justify-content:center;margin:10px 0}.tab{padding:10px 16px;border-radius:20px;background:#1a1a1a;border:1px solid #333;cursor:pointer;font-weight:bold;font-size:13px}.tab.active{background:#7c3aed;color:#fff}
.panel{display:none;max-width:650px;margin:0 auto;background:#111;border-radius:16px;padding:12px;border:1px solid #222}.panel.active{display:block}
textarea{width:100%;padding:12px;border-radius:12px;background:#1e1e1e;color:#fff;border:1px solid #333}
select{padding:10px;border-radius:10px;background:#1e1e1e;color:#fff;border:1px solid #333;margin:4px;font-size:13px}
button{width:100%;padding:14px;background:#7c3aed;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:bold;margin-top:8px;cursor:pointer}
video{width:100%;max-width:500px;border-radius:16px;background:#000;border:2px solid #222;min-height:500px;margin-top:10px}
#log{color:#22c55e;font-weight:bold;margin:10px;font-size:14px}
.platforms{display:flex;gap:6px;justify-content:center;margin:8px 0}.p-btn{padding:6px 12px;border-radius:16px;background:#1e1e1e;border:1px solid #333;font-size:12px;cursor:pointer}.p-btn.active{background:#fff;color:#000;font-weight:bold}
#dl{display:none} #dl button{background:#22c55e;margin-top:10px}
</style></head><body>
<h1>🎬 AI Video Maker Pro</h1>

<div class="tabs">
<div class="tab active" id="t1" onclick="sTab(1)">📝 Text se Video</div>
<div class="tab" id="t2" onclick="sTab(2)">🖼️ Image se Video</div>
</div>

<div id="p1" class="panel active">
<textarea id="txt" rows="3" placeholder="Kahani likhein: A boy in jungle at night, cinematic"></textarea><br>
<select id="d1"><option value="60" selected>1 Minute</option><option value="300">5 Minute</option><option value="600">10 Minute</option><option value="1740">29 Minute</option></select>
<select id="f1"><option value="tk" selected>TikTok 9:16</option><option value="yt">YouTube 16:9</option><option value="fb">Facebook 1:1</option></select>
<div class="platforms">
<div class="p-btn active" onclick="setF('tk',1)" id="pf1-tk">📱 TikTok</div>
<div class="p-btn" onclick="setF('yt',1)" id="pf1-yt">📺 YouTube</div>
<div class="p-btn" onclick="setF('fb',1)" id="pf1-fb">📘 Facebook</div>
</div>
<button onclick="makeText()">🎥 Text se Video Banao</button>
</div>

<div id="p2" class="panel">
<input type="file" id="imgIn" accept="image/*" multiple style="width:100%;padding:10px;background:#1e1e1e;border-radius:10px;border:1px dashed #444">
<select id="d2"><option value="60" selected>1 Minute</option><option value="300">5 Minute</option><option value="1740">29 Minute</option></select>
<select id="f2"><option value="tk" selected>TikTok 9:16</option><option value="yt">YouTube 16:9</option><option value="fb">Facebook 1:1</option></select>
<div class="platforms">
<div class="p-btn active" onclick="setF('tk',2)" id="pf2-tk">📱 TikTok</div>
<div class="p-btn" onclick="setF('yt',2)" id="pf2-yt">📺 YouTube</div>
<div class="p-btn" onclick="setF('fb',2)" id="pf2-fb">📘 Facebook</div>
</div>
<button onclick="makeImg()">🖼️ Image se Video Banao</button>
</div>

<p id="log">✅ Ready - Yehi wala code hai jo aap ke screenshot mein chal raha tha</p>
<video id="vid" controls playsinline autoplay></video>
<a id="dl" download="video.webm"><button>⬇️ Video Download Karo</button></a>
<canvas id="can" width="720" height="1280" style="display:none"></canvas>

<script>
let curFmt={1:'tk',2:'tk'},uploaded=[],cW=720,cH=1280;
const can=document.getElementById('can'),ctx=can.getContext('2d'),vid=document.getElementById('vid'),log=document.getElementById('log'),dl=document.getElementById('dl');
function sTab(n){document.getElementById('p1').classList.toggle('active',n==1);document.getElementById('p2').classList.toggle('active',n==2);document.getElementById('t1').classList.toggle('active',n==1);document.getElementById('t2').classList.toggle('active',n==2);}
function setF(f,tab){curFmt[tab]=f;['tk','yt','fb'].forEach(x=>{let e=document.getElementById(`pf${tab}-${x}`);if(e)e.classList.toggle('active',x==f);});if(f=='yt'){cW=1280;cH=720;}else if(f=='fb'){cW=1080;cH=1080;}else{cW=720;cH=1280;}can.width=cW;can.height=cH;}
document.getElementById('imgIn').addEventListener('change',e=>{uploaded=[];Array.from(e.target.files).forEach(f=>{uploaded.push(URL.createObjectURL(f));});});

async function getImg(prompt){
try{let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${cW}&height=${cH}&nologo=true&seed=${Math.floor(Math.random()*99999)}`;
let blob=await fetch(url).then(r=>r.blob());let u=URL.createObjectURL(blob);let im=new Image();await new Promise(r=>{im.onload=r;im.onerror=r;im.src=u;});return im.naturalWidth?im:null;}catch(e){return null;}}
async function makeText(){
let raw=document.getElementById('txt').value.trim()||"scary jungle at night";let total=parseInt(document.getElementById('d1').value);setF(document.getElementById('f1').value,1);
log.innerText="⏳ 3 AI Images bana raha hun...";let list=[];
for(let i=0;i<3;i++){let p=raw+(i==0?" hook scene":i==1?" middle story":" ending scene")+" cinematic ultra realistic";let im=await getImg(p);if(im)list.push(im);log.innerText=`Image ${i+1}/3 Ready...`;}
if(list.length==0)return log.innerText="Net slow hai, dubara try karein";await render(list,total,["Hook - 0:00-0:20","Story - 0:20-0:40","Ending - 0:40-1:00"]);}
async function makeImg(){
if(uploaded.length==0)return alert('Image select karein');let total=parseInt(document.getElementById('d2').value);setF(document.getElementById('f2').value,2);
let list=[];for(let u of uploaded){let im=new Image();await new Promise(r=>{im.onload=r;im.src=u;});list.push(im);}await render(list,total,null);}
async function render(imgs,totalSec,labels){
log.innerText=`🔴 ${totalSec/60} Min Recording Start...`;
let stream=can.captureStream(30);let rec=new MediaRecorder(stream,{mimeType:"video/webm;codecs=vp8"});let chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
rec.onstop=()=>{let b=new Blob(chunks,{type:"video/webm"});let u=URL.createObjectURL(b);vid.src=u;vid.play();dl.href=u;dl.style.display="block";log.innerText=`✅ ${totalSec/60} Min Ready! Format: ${curFmt[1]}`;};
rec.start(200);let start=Date.now();
(function draw(){
let elapsed=(Date.now()-start)/1000;if(elapsed>=totalSec){rec.stop();return;}
let idx=Math.floor((elapsed/(totalSec/imgs.length))%imgs.length);let p=(elapsed%(totalSec/imgs.length))/(totalSec/imgs.length);
let img=imgs[idx];ctx.fillRect(0,0,cW,cH);
if(img){let zoom=1+ p*0.5;let ratio=Math.max(cW/img.width,cH/img.height)*zoom;let nw=img.width*ratio,nh=img.height*ratio;let ox=(cW-nw)/2+Math.sin(elapsed*0.5)*30,oy=(cH-nh)/2;ctx.drawImage(img,ox,oy,nw,nh);}
ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,cH-120,cW,120);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font=`bold ${Math.floor(cW*0.04)}px sans-serif`;
let label=labels?labels[idx]:`Scene ${idx+1}`;ctx.fillText(label,cW/2,cH-50);
requestAnimationFrame(draw);
})();
}
</script></body></html>
