<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free AI Video Maker</title>
<style>body{background:#111;color:#fff;text-align:center;font-family:sans-serif;padding:20px}
input{width:90%;padding:15px;border-radius:10px;border:none}
button{margin-top:15px;padding:15px 30px;background:#7c3aed;color:#fff;border:none;border-radius:10px;font-size:18px}
video{width:95%;max-width:500px;margin-top:20px;border-radius:15px}</style></head>
<body>
<h1>🎬 AI Video Maker - Working 100%</h1>
<input id="p" placeholder="A lion dancing in desert, cinematic">
<br><button onclick="go()">Video Banao</button>
<p id="s"></p><video id="v" controls autoplay loop></video>
<canvas id="c" style="display:none"></canvas>
<script>
async function go(){
let pr=document.getElementById('p').value;if(!pr)return alert('Pehle likho');
let s=document.getElementById('s');s.innerText='Video ban rahi hai... 15 sec';
let canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
canvas.width=720;canvas.height=720;
let imgs=[];for(let i=0;i<3;i++){let im=new Image();im.crossOrigin='anonymous';
im.src=`https://image.pollinations.ai/prompt/${encodeURIComponent(pr+' scene '+(i+1))}?width=720&height=720&nologo=true&seed=${Math.random()*1000|0}`;
await new Promise(r=>{im.onload=r;im.onerror=r});imgs.push(im);}
let stream=canvas.captureStream(30),rec=new MediaRecorder(stream,{mimeType:'video/webm'}),ch=[];
rec.ondataavailable=e=>ch.push(e.data);
rec.onstop=()=>{let b=new Blob(ch,{type:'video/webm'});document.getElementById('v').src=URL.createObjectURL(b);s.innerText='Video Ready! ✅';};
rec.start();let f=0;let it=setInterval(()=>{ctx.drawImage(imgs[f%3],0,0,720,720);
ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,620,720,100);ctx.fillStyle='#fff';ctx.font='20px sans-serif';ctx.fillText(pr.slice(0,50),20,670);
f++;if(f>90){clearInterval(it);rec.stop();}},100);}
</script></body></html>
