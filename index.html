
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Video Maker</title>
  <meta name="description" content="Create amazing AI video ideas for TikTok, YouTube Shorts and social media.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
    }
    header {
      text-align: center;
      padding: 25px 15px;
      background: #121a30;
    }
    header h1 { color: #72e6c1; }
    main {
      max-width: 650px;
      margin: 30px auto;
      padding: 20px;
    }
    .card {
      background: #151e34;
      padding: 22px;
      border-radius: 16px;
      border: 1px solid #34415e;
    }
    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: bold;
    }
    textarea, select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #354665;
      background: #0c1427;
      color: white;
      font-size: 16px;
    }
    textarea { min-height: 110px; }
    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 9px;
      background: #72e6c1;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 18px;
      padding: 14px;
      background: #0c1427;
      border-radius: 9px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }
    .small { color: #bdc8df; font-size: 14px; }
    footer { text-align: center; padding: 20px; color: #bdc8df; }
  </style>
</head>
<body>
  <header>
    <h1>AI Video Maker</h1>
    <p>Create videos for TikTok, YouTube Shorts & Reels</p>
  </header>

  <main>
    <div class="card">
      <h2>Create Your Video</h2>
      <p class="small">Describe the video you want to create.</p>

      <label for="mode">Video Type</label>
      <select id="mode">
        <option>Text to Video</option>
        <option>Image to Video</option>
      </select>

      <label for="prompt">Your Video Idea</label>
      <textarea id="prompt" placeholder="Example: A fast cricket bowler taking a wicket in a full stadium..."></textarea>

      <label for="format">Video Format</label>
      <select id="format">
        <option value="9:16">9:16 - TikTok / Shorts</option>
        <option value="16:9">16:9 - YouTube</option>
        <option value="1:1">1:1 - Square Video</option>
      </select>

      <label for="duration">Video Length</label>
      <select id="duration">
        <option value="5">5 Seconds</option>
        <option value="10">10 Seconds</option>
      </select>

      <button onclick="createVideo()">Create AI Video</button>
      <div id="result" aria-live="polite">Your video request will appear here.</div>
    </div>
  </main>

  <footer>AI Video Maker | Demo Version</footer>

  <script>
    function createVideo() {
      const prompt = document.getElementById("prompt").value.trim();
      const mode = document.getElementById("mode").value;
      const format = document.getElementById("format").value;
      const duration = document.getElementById("duration").value;
      const result = document.getElementById("result");

      if (!prompt) {
        result.textContent = "Please enter your video idea first.";
        return;
      }

      result.textContent =
        "Demo only: AI video generation is not connected yet. " +
        "Type: " + mode +
        " | Format: " + format +
        " | Duration: " + duration + " seconds. " +
        "Your idea: " + prompt +
        ". Connect a secure AI video API to generate a real video.";
    }
  </script>
</body>
</html>
