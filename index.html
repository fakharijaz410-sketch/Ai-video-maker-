<!DOCTYPE html><html lang="ur"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Maker Pro</title>
<style>*{box-sizing:border-box}body{background:#08080a;color:#fff;font-family:system-ui;margin:0;padding:12px;text-align:center}
h1{font-size:22px}.tabs{display:flex;gap:8px;justify-content:center;margin:14px 0}
.tab{padding:12px 20px;border-radius:25px;background:#1e1e1e;border:1px solid #333;cursor:pointer;font-weight:700}
.tab.active{background:#7c3aed;border-color:#7c3aed}
.panel{display:none;background:#121212;border-radius:18px;padding:14px;max-width:650px;margin:0 auto;border:1px solid #222}
.panel.active{display:block}
textarea{width:100%;padding:14px;border-radius:12px;background:#1e1e1e;color:#fff;border:1px solid #333;font-size:15px}
input[type=file]{width:100%;padding:12px;background:#1e1e1e;border-radius:12px;border:1px dashed #444;color:#aaa}
.row{display:flex;gap:8px;margin-top:10px}.row select{flex:1;padding:12px;border-radius:12px;background:#1e1e1e;color:#fff;border:1px solid #333}
button.main{width:100%;padding:16px;background:linear-gradient(90deg,#7c3aed,#a855f7);color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin-top:12px}
#log{color:#22c55e;margin:14px 0;font-size:15px;min-height:20px;font-weight:600}
video{width:100%;max-width:650px;border-radius:16px;background:#000;border:2px solid #222;min-height:300px}
.platforms{display:flex;gap:8px;justify-content:center;margin:10px 0}.p-btn{padding:8px 14px;border-radius:20px;background:#1e1e1e;border:1px solid #333;font-size:13px;cursor:pointer}.p-btn.active{background:#fff;color:#000;font-weight:bold}
#dl{display:none;margin-top:10px} #dl button{background:#22c55e}
</style></head><body>
<h1>🎬 AI Video Maker Pro</h1>
<p style="color:#888;font-size:13px">Text to Video • Image to Video • 1 to 29 Min • YouTube TikTok Facebook</p>
<div class="tabs">
<div class="tab active" id="tab1" onclick="switchTab(1)">📝 Text se Video</div>
<div class="tab" id="tab2" onclick="switchTab(2)">🖼️ Image se Video</div>
</div>
<div id="panel1" class="panel active">
<textarea id="txt" rows="4" placeholder="Kahani likhein / Write story: A brave boy in jungle at night"></textarea>
<div class="row">
<select id="dur1"><option value="60">1 Minute</option><option value="120">2 Minute</option><option value="300" selected>5 Minute</option><option value="600">10 Minute</option><option value="900">15 Minute</option><option value="1200">20 Minute</option><option value="1740">29 Minute Full</option></select>
<select><option>Urdu + English</option></select>
</div>
<div class="platforms">
<div class="p-btn active" id="pf1-yt" onclick="setFormat('yt',1)">📺 YouTube (16:9)</div>
<div class="p-btn" id="pf1-tk" onclick="setFormat('tk',1)">📱 TikTok (9:16)</div>
<div class="p-btn" id="pf1-fb" onclick="setFormat('fb',1)">📘 Facebook (1:1)</div>
</div>
<button class="main" onclick="makeTextVideo()">🎥 Text se Video Banao</button>
</div>
<div id="panel2" class="panel">
<input type="file" id="imgIn" accept="image/*" multiple>
<div class="row">
<select id="dur2"><option value="60" selected>1 Minute</option><option value="300">5 Minute</option><option value="1740">29 Minute</option></select>
<select id="anim"><option value="zoomIn">Zoom In</option><option value="zoomOut">Zoom Out</option><option value="pan">Pan Effect</option><option value="kenburns">Ken Burns</option></select>
</div>
<div class="platforms">
<div class="p-btn active" id="pf2-yt" onclick="setFormat('yt',2)">📺 YouTube</div>
<div class="p-btn" id="pf2-tk" onclick="setFormat('tk',2)">📱 TikTok</div>
<div class="p-btn" id="pf2-fb" onclick="setFormat('fb',2)">📘 Facebook</div>
</div>
<button class="main" onclick="makeImageVideo()">🖼️ Image se Video Banao</button>
</div>
<p id="log">Ready - 1 se 29 min tak</p>
<video id="vid" controls playsinline></video><br>
<a id="dl" download><button class="main">⬇️ Video Download Karo</button></a>
<canvas id="can" width="1280" height="720" style="display:none"></canvas>
<script>
let currentFormat={1:'yt',2:'yt'},uploadedImages=[],currentCanvas={w:1280,h:720};
function switchTab(n){panel1.classList.toggle('active',n==1);panel2.classList.toggle('active',n==2);tab1.classList.toggle('active',n==1);tab2.classList.toggle('active',n==2);}
function setFormat(f,tab){currentFormat[tab]=f;['yt','tk','fb'].forEach(x=>{let el=document.getElementById(`pf${tab}-${x}`);if(el)el.classList.toggle('active',x==f);});if(f=='yt')currentCanvas={w:1280,h:720};if(f=='tk')currentCanvas={w:720,h:1280};if(f=='fb')currentCanvas={w:1080,h:1080};can.width=currentCanvas.w;can.height=currentCanvas.h;}
imgIn.addEventListener('change',e=>{uploadedImages=[];Array.from(e.target.files).forEach(file=>{uploadedImages.push(URL.createObjectURL(file));});});
const can=document.getElementById('can'),ctx=can.getContext('2d'),vid=document.getElementById('vid'),log=document.getElementById('log'),dl=document.getElementById('dl');
async function translateUrdu(t){try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(t)}&langpair=ur|en`);let d=await r.json();if(d.responseData)return d.responseData.translatedText;}catch(e){}return t;}
async function fetchImageAsBlob(prompt){try{let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=${currentCanvas.w}&height=${currentCanvas.h}&nologo=true&seed=${Math.floor(Math.random()*100000)}`;let blob=await fetch(url).then(r=>r.blob());let bUrl=URL.createObjectURL(blob);let img=new Image();await new Promise(res=>{img.onload=res;img.onerror=res;img.src=bUrl;});return img.naturalWidth?img:null;}catch(e){return null;}}
async function makeTextVideo(){let raw=txt.value.trim();if(!raw)return alert('Kahani likhein!');let totalSec=parseInt(dur1.value);setFormat(currentFormat[1],1);log.innerText='Urdu to English...';let promptEn=await translateUrdu(raw);let sentences=promptEn.split(/[.۔!?\n]+/).filter(s=>s.trim().length>5);if(sentences.length==0)sentences=[promptEn];let scenesCount=Math.max(2,Math.floor(totalSec/20));log.innerText=`${scenesCount} AI images bana raha hun...`;let images=[];for(let i=0;i<scenesCount;i++){let part=sentences[i%sentences.length];let img=await fetchImageAsBlob(part+" cinematic, ultra realistic, 8k");if(img)images.push({img,text:part.slice(0,70)});log.innerText=`Image ${i+1}/${scenesCount} ready`; }if(images.length==0)return log.innerText="Image nahi bani";await renderVideo(images,totalSec,raw);}
async function makeImageVideo(){if(uploadedImages.length==0)return alert('Image select karein!');let totalSec=parseInt(dur2.value);setFormat(currentFormat[2],2);let images=[];for(let url of uploadedImages){let img=new Image();await new Promise(r=>{img.onload=r;img.src=url;});images.push({img,text:'',anim:anim.value});}await renderVideo(images,totalSec,"Image Video",true);}
async function renderVideo(list,totalSec,fullText,isLoop=false){log.innerText=`${totalSec/60} min recording start...`;let stream=can.captureStream(30);let mime="video/webm";if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8"))mime="video/webm;codecs=vp8";let rec=new MediaRecorder(stream,{mimeType:mime});let chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};rec.onstop=()=>{let blob=new Blob(chunks,{type:mime});let url=URL.createObjectURL(blob);vid.src=url;vid.play();dl.href=url;dl.download=`${currentFormat[1]}-${totalSec/60}min-video.webm`;dl.style.display="block";log.innerText=`✅ ${totalSec/60} Min Ready! Format: ${currentFormat[1]}`;};rec.start(200);let sceneDuration=totalSec/list.length,start=Date.now();return new Promise(resolve=>{function draw(){let elapsed=(Date.now()-start)/1000;if(elapsed>=totalSec){rec.stop();resolve();return;}let sceneIdx=Math.floor(elapsed/sceneDuration);if(sceneIdx>=list.length)sceneIdx=list.length-1;let item=list[sceneIdx];let p=(elapsed%sceneDuration)/sceneDuration;ctx.fillStyle="#000";ctx.fillRect(0,0,currentCanvas.w,currentCanvas.h);if(item&&item.img){let scale=1+p*0.3;if(item.anim=='zoomOut')scale=1.3-p*0.3;let w=item.img.width,h=item.img.height,ratio=Math.max(currentCanvas.w/w,currentCanvas.h/h)*scale,nw=w*ratio,nh=h*ratio,ox=(currentCanvas.w-nw)/2,oy=(currentCanvas.h-nh)/2;if(item.anim=='pan')ox=(currentCanvas.w-nw)/2-p*150;ctx.drawImage(item.img,ox,oy,nw,nh);}ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,currentCanvas.h-currentCanvas.h*0.22,currentCanvas.w,currentCanvas.h*0.22);ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font=`bold ${Math.floor(currentCanvas.w*0.035)}px sans-serif`;ctx.fillText((item.text||fullText).slice(0,60),currentCanvas.w/2,currentCanvas.h-currentCanvas.h*0.12);if(Math.floor(elapsed)%2==0)log.innerText=`🔴 Recording ${Math.floor(elapsed)}/${totalSec} sec`;requestAnimationFrame(draw);}draw();});}
</script></body></html>
