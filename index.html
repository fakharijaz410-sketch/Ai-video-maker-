
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fixed Player</title>
<style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif;padding:10px}textarea,select{width:95%;max-width:600px;padding:14px;border-radius:12px;background:#1e1e1e;color:#fff;border:none;margin-top:8px}button{width:95%;max-width:600px;padding:16px;background:#7c3aed;color:#fff;border:none;border-radius:14px;font-size:19px;margin-top:10px;font-weight:bold}video{width:95%;max-width:500px;border-radius:16px;margin-top:12px;background:#111}#log{color:#22c55e}</style></head><body>
<h1>🎬 Video Player Fixed</h1>
<textarea id="txt" rows="3" placeholder="Story likhein English mein"></textarea><br>
<select id="dur"><option value="30">30 Sec Test</option><option value="60" selected>1 Min</option><option value="300">5 Min</option><option value="1200">20 Min</option></select><br>
<button onclick="make()">Video Banao</button>
<p id="log"></p>
<video id="vid" controls playsinline preload="auto"></video><br>
<a id="dl" download="video.webm" style="display:none"><button style="background:#22c55e">⬇️ Gallery Mein Save Karo / Download</button></a>
<canvas id="can" width="720" height="1280" style="display:none"></canvas>
<script>
const can=document.getElementById('can'),ctx=can.getContext('2d'),vid=document.getElementById('vid'),log=document.getElementById('log'),dl=document.getElementById('dl');
async function make(){
let prompt=document.getElementById('txt').value||"A brave wrestler";
let totalSec=parseInt(document.getElementById('dur').value);
let scenes=Math.ceil(totalSec/5);
log.innerText="Ban rahi hai...";

let mime="video/webm"; 
if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8")) mime="video/webm;codecs=vp8";
else if(MediaRecorder.isTypeSupported("video/webm")) mime="video/webm";

let stream=can.captureStream(30);
let rec=new MediaRecorder(stream,{mimeType:mime});
let chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
rec.onstop=()=>{
let blob=new Blob(chunks,{type:mime});
let url=URL.createObjectURL(blob);
vid.src=url;vid.load();
dl.href=url;dl.style.display="inline-block";
log.innerText="✅ Ready! Agar upar na chale to Download par click karke Gallery mein chalao";
};
rec.start(100);
for(let i=0;i<scenes;i++){
let grad=ctx.createLinearGradient(0,0,0,1280);grad.addColorStop(0,["#7c3aed","#059669","#2563eb","#db2777"][i%4]);grad.addColorStop(1,"#000");
ctx.fillStyle=grad;ctx.fillRect(0,0,720,1280);
ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(0,1000,720,280);
ctx.fillStyle="#fff";ctx.font="bold 28px sans-serif";ctx.textAlign="center";
ctx.fillText(prompt.slice(i*30,(i+1)*30),360,1080);
ctx.font="20px sans-serif";ctx.fillText(`Scene ${i+1}/${scenes} - ${mime}`,360,1120);
log.innerText=`Recording ${i+1}/${scenes}...`;
await new Promise(r=>setTimeout(r,5000));
}
rec.stop();
}
</script></body></html>
