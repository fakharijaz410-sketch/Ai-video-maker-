
<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Fixed - No Black Screen</title>
<style>body{background:#000;color:#fff;text-align:center;font-family:sans-serif;padding:10px}textarea{width:95%;max-width:600px;padding:14px;border-radius:12px;background:#1e1e1e;color:#fff;border:none}button{width:95%;max-width:600px;padding:16px;background:#7c3aed;color:#fff;border:none;border-radius:14px;font-size:18px;font-weight:bold;margin-top:10px}video{width:95%;max-width:500px;border-radius:16px;margin-top:12px;background:#111;min-height:400px;border:2px solid #333}#log{color:#22c55e;margin:10px}</style></head><body>
<h1>🎬 Final Fixed - Video Ab Chalegi</h1>
<textarea id="txt" rows="2" placeholder="Yahan likhein: raat ka waqt tha"></textarea><br>
<button onclick="make()">▶️ Video Banao (100% Working)</button>
<p id="log">Ready</p>
<video id="vid" controls playsinline autoplay muted loop></video><br>
<a id="dl" style="display:none" download="video.webm"><button style="background:#22c55e">⬇️ Download Karo</button></a>
<canvas id="can" width="720" height="1280" style="display:none"></canvas>
<script>
const can=document.getElementById('can'),ctx=can.getContext('2d'),vid=document.getElementById('vid'),log=document.getElementById('log'),dl=document.getElementById('dl');
let aiImg=null;

async function make(){
let text=document.getElementById('txt').value||"Raat ka waqt tha";
log.innerText="Image load ho rahi hai...";

// AI Image try karenge, lekin video us ke bina bhi chalegi
aiImg=new Image();aiImg.crossOrigin="anonymous";
let enText=text; try{let r=await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=ur|en`);let d=await r.json();if(d.responseData)enText=d.responseData.translatedText;}catch(e){}
let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(enText+" cinematic night scene, movie")}?width=720&height=1280&nologo=true&seed=${Date.now()}`;
aiImg.src=url; // load hone do, video pehle se start

let stream=can.captureStream(25);
let mime="";if(MediaRecorder.isTypeSupported("video/webm;codecs=vp9"))mime="video/webm;codecs=vp9";else if(MediaRecorder.isTypeSupported("video/webm;codecs=vp8"))mime="video/webm;codecs=vp8";else mime="video/webm";
let rec=new MediaRecorder(stream,{mimeType:mime});
let chunks=[];rec.ondataavailable=e=>{if(e.data.size>0)chunks.push(e.data)};
rec.onstop=()=>{let b=new Blob(chunks,{type:mime});let u=URL.createObjectURL(b);vid.src=u;vid.play();dl.href=u;dl.style.display="block";log.innerText="✅ Video Ready! Ab chal rahi hai";};
rec.start();

let start=Date.now();let duration=15000; // 15 sec ka demo, 20 min ke liye 1200000 kar dena
(function draw(){
let t=(Date.now()-start)/1000;
if(t>duration/1000){rec.stop();return;}

// 1. MOVING BACKGROUND - Ye kabhi kaala nahi hoga
let hue=(t*10)%360;
ctx.fillStyle=`hsl(${hue}, 70%, 20%)`;ctx.fillRect(0,0,720,1280);
// moving light
ctx.fillStyle=`hsl(${(hue+60)%360}, 80%, 50%)`;
ctx.beginPath();ctx.arc(360+Math.sin(t)*200, 400+Math.cos(t*0.7)*200, 250, 0, Math.PI*2);ctx.fill();

// 2. AI Image agar load ho gayi to upar lagao
if(aiImg && aiImg.complete && aiImg.naturalWidth>0){
try{ctx.globalAlpha=0.7;ctx.drawImage(aiImg,0,0,720,1280);ctx.globalAlpha=1;}catch(e){}
}

// 3. Text
ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,1050,720,250);
ctx.fillStyle="#fff";ctx.font="bold 32px Noto Nastaliq Urdu, sans-serif";ctx.textAlign="center";
ctx.fillText(text,360,1130);
ctx.font="18px sans-serif";ctx.fillText(`${Math.floor(t)} sec / Moving Video`,360,1180);

log.innerText=`Recording... ${Math.floor(t)} sec`;
requestAnimationFrame(draw);
})();
}
</script></body></html>
